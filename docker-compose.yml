version: "3.9"

services:
  # ── Base de données MongoDB ───────────────────────────────────
  mongo:
    image: mongo:6
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend FastAPI ───────────────────────────────────────────
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - MONGO_URI=mongodb://mongo:27017
      - SECRET_KEY=airsafe_super_secret_key_2025
      - ALGORITHM=HS256
      - PYTHONPATH=/app
    volumes:
      # Monter le dossier ai/ pour que les imports fonctionnent
      - ./ai:/app/ai:ro
      - ./backend/app:/app/app:ro
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

  # ── Frontend React ────────────────────────────────────────────
  frontend:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend

volumes:
  mongo_data: